<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#31add3">
  <title>Fairy Tails — Orders</title>
  <style>
    /* -------- Tokens -------- */
    :root {
      --accent: #31add3;
      --accent-dark: #248faf;
      --accent-soft: #e9f7fc;
      --ink: #1d2731;
      --ink-soft: #5a6772;
      --line: #e6ebef;
      --bg: #ffffff;
      --bg-soft: #f7fafb;
      --danger: #c0392b;
      --shadow: 0 1px 2px rgba(20,40,60,.04), 0 4px 12px rgba(20,40,60,.06);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-soft);
      color: var(--ink);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body { padding-bottom: env(safe-area-inset-bottom); }
    button { font: inherit; cursor: pointer; }
    input, select, textarea, button { font: inherit; color: inherit; }

    /* -------- App shell -------- */
    .app { max-width: 640px; margin: 0 auto; }
    header.bar {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px 0;
    }
    .brand {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px; font-weight: 700;
      color: var(--ink);
      letter-spacing: .2px;
    }
    .brand h1 small {
      display: block; font-size: 11px; font-weight: 500;
      color: var(--ink-soft); letter-spacing: .3px; text-transform: uppercase;
    }
    .initials-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-soft); color: var(--accent-dark);
      border: 1px solid #c9e8f3;
      padding: 6px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 600;
    }
    .initials-chip button {
      background: none; border: 0; padding: 0;
      color: var(--accent-dark); text-decoration: underline;
      font-size: 12px; font-weight: 600;
    }

    /* -------- Tabs -------- */
    .tabs { display: flex; gap: 2px; margin-top: 10px; }
    .tab {
      flex: 1 1 0; min-width: 0; padding: 10px 2px; text-align: center;
      background: transparent; border: 0;
      font-size: 13px; line-height: 1.2; font-weight: 600;
      color: var(--ink-soft);
      border-bottom: 3px solid transparent;
    }
    .tab-count {
      display: inline-block; min-width: 12px;
      color: var(--danger); font-size: 11px; font-weight: 700;
    }
    .tab[aria-selected="true"] {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }

    main { padding: 14px; }
    section.tab-panel { display: none; }
    section.tab-panel.active { display: block; }

    /* -------- Forms / cards -------- */
    .card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px; font-size: 15px; font-weight: 700;
      color: var(--ink);
    }
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--ink-soft); margin: 10px 0 6px;
    }
    input[type="text"], input[type="number"], input[type="date"],
    select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 16px;
      color: var(--ink);
      -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      outline: 0;
      border-color: var(--accent);
      background: var(--bg);
      box-shadow: 0 0 0 3px rgba(49,173,211,.18);
    }
    textarea { resize: vertical; min-height: 44px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }
    .row .narrow { flex: 0 0 110px; }

    /* -------- Buttons -------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 14px 16px;
      border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      font-size: 16px; font-weight: 700;
      width: 100%;
      transition: background .12s ease, transform .12s ease;
    }
    .btn:active { background: var(--accent-dark); transform: scale(.99); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.secondary {
      background: var(--bg); color: var(--accent-dark);
      border: 1px solid #c9e8f3;
    }
    .btn.danger { background: var(--danger); }
    .btn-mini {
      padding: 8px 12px; font-size: 13px; width: auto;
      border-radius: 999px;
    }
    .icon-btn {
      background: transparent; border: 0; padding: 6px;
      color: var(--ink-soft); font-size: 13px; font-weight: 600;
    }

    /* -------- Order item card -------- */
    .item {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .item .item-main { flex: 1; min-width: 0; }
    .item .item-name {
      font-size: 16px; font-weight: 700; color: var(--ink);
      word-break: break-word;
    }
    .item .meta {
      margin-top: 6px;
      font-size: 12px; color: var(--ink-soft);
      display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    }
    .badge {
      display: inline-block;
      background: var(--accent-soft); color: var(--accent-dark);
      padding: 2px 8px; border-radius: 999px;
      font-weight: 600; font-size: 11px;
    }
    .item .notes {
      margin-top: 6px; font-size: 13px; color: var(--ink);
      background: var(--bg-soft); border-radius: 8px;
      padding: 6px 8px; font-style: italic; word-break: break-word;
    }
    .item .ordered-btn {
      flex: 0 0 auto;
      padding: 12px 14px;
      border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      align-self: stretch;
      min-width: 84px;
    }
    .item .ordered-btn:active { background: var(--accent-dark); }
    .item .action-stack {
      flex: 0 0 96px; display: flex; flex-direction: column; gap: 7px;
    }
    .item .action-stack .ordered-btn {
      width: 100%; align-self: auto; min-width: 0;
    }
    .flag-btn {
      width: 100%; padding: 10px 8px;
      border: 0; border-radius: var(--radius-sm);
      background: var(--danger); color: #fff;
      font-size: 13px; font-weight: 700;
    }
    .attention-card { display: block; }
    .attention-note {
      margin-top: 9px; padding: 10px;
      border-left: 4px solid var(--danger); border-radius: 8px;
      background: #fff1ef; color: var(--ink);
      font-size: 14px; font-weight: 650; word-break: break-word;
    }
    .attention-dates {
      margin-top: 8px; color: var(--ink-soft); font-size: 12px;
    }
    .attention-actions {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-top: 12px;
    }
    .attention-actions .btn { padding: 10px 8px; font-size: 13px; }

    /* -------- Section heads -------- */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 18px 4px 8px;
    }
    .section-head h3 {
      margin: 0; font-size: 15px; font-weight: 700; color: var(--ink);
    }
    .section-head .count {
      font-size: 12px; color: var(--ink-soft); font-weight: 600;
    }
    .section-empty {
      font-size: 13px; color: var(--ink-soft);
      padding: 10px 14px;
      background: var(--bg);
      border: 1px dashed var(--line); border-radius: var(--radius);
      margin-bottom: 10px;
    }

    /* -------- Recently ordered -------- */
    details.recent {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-top: 18px;
    }
    details.recent > summary {
      list-style: none; cursor: pointer;
      font-size: 14px; font-weight: 700; color: var(--ink);
      display: flex; align-items: center; justify-content: space-between;
    }
    details.recent > summary::-webkit-details-marker { display: none; }
    details.recent > summary::after {
      content: "▾"; color: var(--ink-soft); font-size: 12px;
      transition: transform .15s ease;
    }
    details.recent[open] > summary::after { transform: rotate(180deg); }
    details.recent .recent-list { margin-top: 10px; }
    .recent-item {
      display: flex; gap: 10px; align-items: center;
      padding: 8px 0; border-top: 1px solid var(--line);
    }
    .recent-item:first-child { border-top: 0; }
    .recent-item .recent-main { flex: 1; min-width: 0; }
    .recent-item .recent-name {
      font-size: 14px; font-weight: 600; color: var(--ink);
      word-break: break-word;
    }
    .recent-item .recent-meta {
      font-size: 11px; color: var(--ink-soft); margin-top: 2px;
    }

    /* -------- Toast -------- */
    .toast {
      position: fixed; left: 50%; bottom: 20px;
      transform: translateX(-50%);
      background: var(--ink); color: #fff;
      padding: 10px 14px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 12px;
      max-width: calc(100% - 28px);
      z-index: 50;
      animation: toast-in .18s ease;
    }
    .toast.error { background: var(--danger); }
    .toast button {
      background: var(--accent); color: #fff;
      border: 0; border-radius: 999px;
      padding: 6px 12px; font-size: 13px; font-weight: 700;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* -------- States -------- */
    .empty {
      text-align: center;
      padding: 28px 18px;
      color: var(--ink-soft);
      background: var(--bg);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .empty strong { color: var(--ink); display: block; margin-bottom: 4px; }
    .loading {
      text-align: center; color: var(--ink-soft);
      padding: 18px; font-size: 14px;
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 4px 4px 8px;
    }
    .toolbar h2 {
      margin: 0; font-size: 15px; font-weight: 700; color: var(--ink);
    }

    /* -------- Initials prompt overlay -------- */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(20,40,60,.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 60;
    }
    /* The default user-agent rule [hidden]{display:none} is overridden by
       .modal-bg's display:flex above, so re-assert it explicitly. Without
       this both modals render on page load. */
    .modal-bg[hidden] { display: none !important; }
    .modal {
      background: var(--bg); border-radius: var(--radius);
      padding: 18px; width: 100%; max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    .modal h2 { margin: 0 0 6px; font-size: 17px; }
    .modal p { margin: 0 0 14px; color: var(--ink-soft); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
    .chip {
      border: 1px solid #c9e8f3; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-dark);
      padding: 7px 10px; font-size: 12px; font-weight: 650;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }

    /* -------- Misc -------- */
    .hint {
      font-size: 12px; color: var(--ink-soft);
      margin-top: 6px;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <h1>The Fairy Tails<small>Staff Order List</small></h1>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-list" aria-selected="true"
                aria-controls="panel-list">Order List</button>
        <button class="tab" role="tab" id="tab-summary" aria-selected="false"
                aria-controls="panel-summary">Summary</button>
        <button class="tab" role="tab" id="tab-attention" aria-selected="false"
                aria-controls="panel-attention">Flagged
          <span class="tab-count" id="attentionCount"></span>
        </button>
      </div>
    </header>

    <main>
      <!-- Order List tab -->
      <section class="tab-panel active" id="panel-list"
               role="tabpanel" aria-labelledby="tab-list">
        <form class="card" id="addForm" autocomplete="off">
          <h2>Add a new item</h2>
          <label for="itemName">Item</label>
          <input type="text" id="itemName" name="itemName"
                 placeholder="e.g. Dog shampoo" required maxlength="120">

          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="Dog Grooming">Dog Grooming</option>
            <option value="Dog Training">Dog Training</option>
            <option value="Dog Boarding">Dog Boarding</option>
            <option value="Doggy Daycare">Doggy Daycare</option>
            <option value="Miscellaneous">Miscellaneous</option>
          </select>

          <div class="row">
            <div class="narrow">
              <label for="quantity">Qty</label>
              <input type="number" id="quantity" name="quantity"
                     min="1" step="1" inputmode="numeric" placeholder="—">
            </div>
            <div>
              <label for="dateAdded">Date</label>
              <input type="date" id="dateAdded" name="dateAdded" required>
            </div>
          </div>

          <label for="notes">Notes <span class="hint">(optional)</span></label>
          <textarea id="notes" name="notes" rows="2" maxlength="240"
                    placeholder="e.g. the lavender one, not the green"></textarea>

          <label for="initials">Your initials <span class="hint">(required)</span></label>
          <input type="text" id="initials" name="initials" maxlength="4"
                 placeholder="e.g. KS" autocapitalize="characters"
                 autocomplete="off" inputmode="text" required>

          <div style="margin-top:14px;">
            <button class="btn" type="submit" id="addBtn">Add Item</button>
          </div>
        </form>

        <div class="toolbar">
          <h2 id="activeHeading">Active items</h2>
          <button class="icon-btn" type="button" id="refreshList"
                  title="Refresh">⟲ Refresh</button>
        </div>
        <div id="activeList"><div class="loading">Loading…</div></div>
      </section>

      <!-- Summary tab -->
      <section class="tab-panel" id="panel-summary"
               role="tabpanel" aria-labelledby="tab-summary">
        <div class="toolbar">
          <h2>By category</h2>
          <button class="icon-btn" type="button" id="refreshSummary"
                  title="Refresh">⟲ Refresh</button>
        </div>
        <div id="summaryList"><div class="loading">Loading…</div></div>

        <details class="recent" id="recentBlock">
          <summary>Recently ordered <span class="hint" id="recentCount"></span></summary>
          <div class="recent-list" id="recentList">
            <div class="loading">Loading…</div>
          </div>
        </details>
      </section>

      <!-- Flagged tab -->
      <section class="tab-panel" id="panel-attention"
               role="tabpanel" aria-labelledby="tab-attention">
        <div class="toolbar">
          <h2>Flagged</h2>
          <button class="icon-btn" type="button" id="refreshAttention"
                  title="Refresh">⟲ Refresh</button>
        </div>
        <div id="attentionList"><div class="loading">Loading…</div></div>
      </section>
    </main>
  </div>

  <div class="modal-bg" id="flagModal" hidden>
    <div class="modal" role="dialog" aria-modal="true"
         aria-labelledby="flagModalTitle">
      <h2 id="flagModalTitle">Flag this item</h2>
      <p>Reason for <strong id="flagItemName"></strong></p>
      <div class="chips" aria-label="Common reasons">
        <button class="chip" type="button" data-chip="Not required">Not required</button>
        <button class="chip" type="button" data-chip="Already here">Already here</button>
        <button class="chip" type="button" data-chip="Stored elsewhere">Stored elsewhere</button>
        <button class="chip" type="button" data-chip="Wrong item">Wrong item</button>
        <button class="chip" type="button" data-chip="Ask manager">Ask manager</button>
      </div>
      <label for="flagNote">Note <span class="hint">(required)</span></label>
      <textarea id="flagNote" rows="4" maxlength="240"
                placeholder="Explain what staff need to know"></textarea>
      <div class="modal-actions">
        <button class="btn secondary" type="button" id="flagCancel">Cancel</button>
        <button class="btn danger" type="button" id="flagSave" disabled>Save</button>
      </div>
    </div>
  </div>


  <script>
    /* ============================ CONFIG ===================================
     * Apps Script Web App URL — managed by the developer/manager.
     * To change it, edit this constant and redeploy via GitHub Pages.
     * ===================================================================== */
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygmkCl1W-ZKq9Argtqmtg7fTfPGyXaw07z4EP68wxwWxGTIZgN4o92cun9yrPHxZdXSA/exec';

    /* ----------------------------- State / utils ---------------------------- */
    const STATE = {
      active: [],
      recent: [],
      attention: [],
      attentionAvailable: null,
      attentionRetentionDays: 30,
      loadFailed: false,
      categories: ['Dog Grooming','Dog Training','Dog Boarding',
                   'Doggy Daycare','Miscellaneous'],
      flagMode: null,
      flagOrderId: null
    };
    const INITIALS_KEY = 'ftails.initials';

    function getApiUrl() {
      return APPS_SCRIPT_URL;
    }

    function getInitials() {
      try { return localStorage.getItem(INITIALS_KEY) || ''; }
      catch (e) { return ''; }
    }
    function saveInitials(v) {
      const clean = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
      try { localStorage.setItem(INITIALS_KEY, clean); } catch (e) {}
      return clean;
    }
    function readInitialsField() {
      const el = document.getElementById('initials');
      return el ? saveInitials(el.value) : '';
    }
    function todayLocalISO() {
      const d = new Date();
      const tz = d.getTimezoneOffset() * 60000;
      return new Date(d - tz).toISOString().slice(0,10);
    }
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      if (sameDay) return 'Today';
      const yest = new Date(today); yest.setDate(today.getDate()-1);
      if (d.toDateString() === yest.toDateString()) return 'Yesterday';
      return d.toLocaleDateString('en-GB',
        { day:'numeric', month:'short' });
    }
    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    /* ----------------------------- Server bridge --------------------------- *
     * Uses fetch() against the Apps Script Web App URL. We send the body as
     * Content-Type: text/plain to avoid a CORS preflight (Apps Script does
     * not handle OPTIONS requests).
     * --------------------------------------------------------------------- */
    async function call(action, params) {
      const url = getApiUrl();
      if (!url) throw new Error('Backend URL not set');
      const res = await fetch(url, {
        method: 'POST',
        // text/plain avoids the CORS preflight that Apps Script rejects.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, params: params || {} }),
        redirect: 'follow'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data;
    }

    /* --------------------------------- UI ---------------------------------- */
    function showToast(msg, opts) {
      opts = opts || {};
      removeToast();
      const t = document.createElement('div');
      t.className = 'toast' + (opts.error ? ' error' : '');
      t.id = 'toast';
      t.innerHTML = '<span>' + escapeHtml(msg) + '</span>';
      if (opts.actionLabel) {
        const btn = document.createElement('button');
        btn.textContent = opts.actionLabel;
        btn.addEventListener('click', () => {
          if (opts.onAction) opts.onAction();
          removeToast();
        });
        t.appendChild(btn);
      }
      document.body.appendChild(t);
      const ttl = opts.ttl || 3000;
      t._timer = setTimeout(removeToast, ttl);
    }
    function removeToast() {
      const t = document.getElementById('toast');
      if (t) {
        if (t._timer) clearTimeout(t._timer);
        t.remove();
      }
    }

    function switchTab(which) {
      ['list', 'summary', 'attention'].forEach(name => {
        const selected = which === name;
        document.getElementById('tab-' + name)
          .setAttribute('aria-selected', selected ? 'true' : 'false');
        document.getElementById('panel-' + name)
          .classList.toggle('active', selected);
      });
      if (which === 'summary') renderSummary();
      if (which === 'attention') renderAttention();
    }

    /* ---- Renderers ---- */
    function renderActive() {
      const wrap = document.getElementById('activeList');
      const heading = document.getElementById('activeHeading');
      heading.textContent = 'Active items (' + STATE.active.length + ')';
      if (!STATE.active.length) {
        wrap.innerHTML =
          '<div class="empty"><strong>No active items</strong>'
          + 'Add the first request using the form above.</div>';
        return;
      }
      wrap.innerHTML = STATE.active.map(o => itemCardHtml(o, false)).join('');
    }

    function renderSummary() {
      const wrap = document.getElementById('summaryList');
      if (STATE.loadFailed) {
        wrap.innerHTML =
          '<div class="empty"><strong>Couldn’t load — tap Refresh</strong>'
          + 'Check your connection and try again.</div>';
        return;
      }
      const grouped = {};
      STATE.categories.forEach(c => grouped[c] = []);
      STATE.active.forEach(o => {
        const cat = grouped[o.category] ? o.category : 'Miscellaneous';
        grouped[cat].push(o);
      });
      const html = STATE.categories.map(cat => {
        const items = grouped[cat];
        const head =
          '<div class="section-head">'
          + '<h3>' + escapeHtml(cat) + '</h3>'
          + '<span class="count">' + items.length + ' item'
          + (items.length === 1 ? '' : 's') + '</span>'
          + '</div>';
        if (!items.length) {
          return head + '<div class="section-empty">No items.</div>';
        }
        return head + items.map(o => itemCardHtml(o, true)).join('');
      }).join('');
      wrap.innerHTML = html;

      // Recently ordered
      const recentList = document.getElementById('recentList');
      const recentCount = document.getElementById('recentCount');
      recentCount.textContent =
        STATE.recent.length ? '(' + STATE.recent.length + ')' : '(0)';
      if (!STATE.recent.length) {
        recentList.innerHTML =
          '<div class="hint">Items marked as ordered in the last 7 days '
          + 'will appear here.</div>';
      } else {
        recentList.innerHTML = STATE.recent.map(o => `
          <div class="recent-item">
            <div class="recent-main">
              <div class="recent-name">${escapeHtml(o.itemName)}</div>
              <div class="recent-meta">
                ${escapeHtml(o.category)} ·
                ordered ${escapeHtml(formatDate(o.orderedDate))}
                ${o.orderedBy ? '· by ' + escapeHtml(o.orderedBy) : ''}
              </div>
            </div>
            <button class="btn btn-mini secondary"
                    data-readd="${escapeHtml(o.orderId)}">Re-add</button>
          </div>
        `).join('');
      }
    }

    function renderAttention() {
      const wrap = document.getElementById('attentionList');
      const count = document.getElementById('attentionCount');
      if (STATE.loadFailed) {
        count.textContent = '';
        wrap.innerHTML =
          '<div class="empty"><strong>Couldn’t load — tap Refresh</strong>'
          + 'Check your connection and try again.</div>';
        return;
      }
      count.textContent = STATE.attentionAvailable && STATE.attention.length
        ? String(STATE.attention.length) : '';
      if (STATE.attentionAvailable === null) {
        wrap.innerHTML = '<div class="loading">Loading…</div>';
        return;
      }
      if (!STATE.attentionAvailable) {
        wrap.innerHTML =
          '<div class="empty"><strong>Flagged items are unavailable</strong>'
          + 'This page is connected to an older backend. Refresh after the '
          + 'backend deployment has been updated.</div>';
        return;
      }
      if (!STATE.attention.length) {
        wrap.innerHTML =
          '<div class="empty"><strong>Nothing flagged</strong>'
          + 'Flagged items and their notes will appear here.</div>';
        return;
      }
      wrap.innerHTML = STATE.attention.map(attentionCardHtml).join('');
    }

    function attentionCardHtml(o) {
      const meta = [];
      meta.push('<span class="badge">' + escapeHtml(o.category) + '</span>');
      if (o.quantity) meta.push('Qty ' + escapeHtml(o.quantity));
      meta.push('Added ' + escapeHtml(formatDate(o.dateAdded)));
      if (o.addedBy) meta.push('by ' + escapeHtml(o.addedBy));
      const originalNotes = o.notes
        ? '<div class="notes">' + escapeHtml(o.notes) + '</div>' : '';
      const flaggedDate = escapeHtml(formatDate(o.attentionDate));
      const attentionBy = o.attentionBy
        ? ' by ' + escapeHtml(o.attentionBy) : '';
      const expiry = new Date(o.attentionDate);
      const expiryText = isNaN(expiry.getTime()) ? ''
        : escapeHtml(formatDate(new Date(expiry.getTime()
          + STATE.attentionRetentionDays * 24 * 60 * 60 * 1000)));
      return ''
        + '<div class="item attention-card">'
        +   '<div class="item-name">' + escapeHtml(o.itemName) + '</div>'
        +   '<div class="meta">' + meta.join(' · ') + '</div>'
        +   originalNotes
        +   '<div class="attention-note">' + escapeHtml(o.attentionNote) + '</div>'
        +   '<div class="attention-dates">Flagged ' + flaggedDate + attentionBy
        +     (expiryText ? ' · Auto-removes ' + expiryText : '') + '</div>'
        +   '<div class="attention-actions">'
        +     '<button class="btn secondary" data-restore="' + escapeHtml(o.orderId)
        +       '">Send back</button>'
        +     '<button class="btn secondary" data-editnote="' + escapeHtml(o.orderId)
        +       '">Edit note</button>'
        +     '<button class="btn" data-ordered="' + escapeHtml(o.orderId)
        +       '">Mark ordered</button>'
        +     '<button class="btn danger" data-remove="' + escapeHtml(o.orderId)
        +       '">Remove</button>'
        +   '</div>'
        + '</div>';
    }

    function itemCardHtml(o, withOrderedBtn) {
      const meta = [];
      meta.push('<span class="badge">' + escapeHtml(o.category) + '</span>');
      if (o.quantity) meta.push('Qty ' + escapeHtml(o.quantity));
      meta.push('Added ' + escapeHtml(formatDate(o.dateAdded)));
      if (o.addedBy) meta.push('by ' + escapeHtml(o.addedBy));
      const notes = o.notes
        ? '<div class="notes">' + escapeHtml(o.notes) + '</div>'
        : '';
      const btn = withOrderedBtn
        ? '<div class="action-stack">'
          + '<button class="ordered-btn" data-ordered="'
          + escapeHtml(o.orderId) + '">Mark ordered</button>'
          + '<button class="flag-btn danger" data-flag="'
          + escapeHtml(o.orderId) + '">Reject / flag</button>'
          + '</div>'
        : '';
      return ''
        + '<div class="item">'
        +   '<div class="item-main">'
        +     '<div class="item-name">' + escapeHtml(o.itemName) + '</div>'
        +     '<div class="meta">' + meta.join(' · ') + '</div>'
        +     notes
        +   '</div>'
        +   btn
        + '</div>';
    }

    /* ---- Data ---- */
    let loading = false;
    async function refresh() {
      if (loading) return;
      loading = true;
      try {
        const data = await call('getOrders');
        STATE.loadFailed = false;
        STATE.active = data.active || [];
        STATE.recent = data.recent || [];
        STATE.attentionAvailable = Array.isArray(data.attention);
        STATE.attention = STATE.attentionAvailable ? data.attention : [];
        const retentionDays = Number(data.attentionRetentionDays);
        STATE.attentionRetentionDays = Number.isFinite(retentionDays)
          ? retentionDays : 30;
        if (Array.isArray(data.categories) && data.categories.length) {
          STATE.categories = data.categories;
        }
        renderActive();
        renderSummary();
        renderAttention();
      } catch (e) {
        console.error(e);
        STATE.loadFailed = true;
        const errorHtml =
          '<div class="empty"><strong>Couldn’t load — tap Refresh</strong>'
          + 'Check your connection and try again.</div>';
        document.getElementById('activeList').innerHTML = errorHtml;
        document.getElementById('summaryList').innerHTML = errorHtml;
        document.getElementById('attentionList').innerHTML = errorHtml;
        document.getElementById('recentList').innerHTML = errorHtml;
        showToast('Could not load orders', { error: true });
      } finally {
        loading = false;
      }
    }

    /* ---- Actions ---- */
    async function handleAdd(e) {
      e.preventDefault();
      const initials = readInitialsField();
      if (!initials) {
        showToast('Please enter your initials', { error: true });
        document.getElementById('initials').focus();
        return;
      }

      const itemName = document.getElementById('itemName').value.trim();
      if (!itemName) return;
      const category = document.getElementById('category').value;
      const quantity = document.getElementById('quantity').value;
      const dateAdded = document.getElementById('dateAdded').value;
      const notes = document.getElementById('notes').value.trim();
      const btn = document.getElementById('addBtn');
      btn.disabled = true; btn.textContent = 'Adding…';
      try {
        const res = await call('addOrder', {
          itemName, category, quantity, notes,
          addedBy: initials,
          dateAdded: dateAdded
            ? new Date(dateAdded + 'T00:00:00').toISOString()
            : null
        });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
        // Reset form (keep category)
        document.getElementById('itemName').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('dateAdded').value = todayLocalISO();
        showToast('Added to the list');
        await refresh();
        document.getElementById('itemName').focus();
      } catch (e) {
        console.error(e);
        showToast('Could not add item', { error: true });
      } finally {
        btn.disabled = false; btn.textContent = 'Add Item';
      }
    }

    function findOrder(orderId) {
      return STATE.active.find(o => o.orderId === orderId)
        || STATE.attention.find(o => o.orderId === orderId)
        || null;
    }

    function syncFlagSave() {
      const note = document.getElementById('flagNote').value.trim();
      document.getElementById('flagSave').disabled = !note;
    }

    function openFlagModal(orderId, mode) {
      const order = findOrder(orderId);
      if (!order) return;
      STATE.flagMode = mode;
      STATE.flagOrderId = orderId;
      document.getElementById('flagModalTitle').textContent =
        mode === 'edit' ? 'Edit note' : 'Flag this item';
      document.getElementById('flagItemName').textContent = order.itemName || '';
      document.getElementById('flagNote').value =
        mode === 'edit' ? String(order.attentionNote || '') : '';
      document.getElementById('flagModal').hidden = false;
      syncFlagSave();
      document.getElementById('flagNote').focus();
    }

    function closeFlagModal() {
      document.getElementById('flagModal').hidden = true;
      document.getElementById('flagNote').value = '';
      STATE.flagMode = null;
      STATE.flagOrderId = null;
      syncFlagSave();
    }

    async function saveFlagNote() {
      const orderId = STATE.flagOrderId;
      const mode = STATE.flagMode;
      const note = document.getElementById('flagNote').value.trim();
      if (!orderId || !mode || !note) {
        syncFlagSave();
        return;
      }
      const initials = getInitials();
      if (mode === 'flag' && !initials) {
        closeFlagModal();
        switchTab('list');
        document.getElementById('initials').focus();
        showToast('Please enter your initials in the form first', { error: true });
        return;
      }
      const button = document.getElementById('flagSave');
      button.disabled = true;
      try {
        const res = mode === 'edit'
          ? await call('updateAttentionNote', { orderId: orderId, note: note })
          : await call('flagAttention', {
              orderId: orderId, note: note, initials: initials
            });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
        if (mode === 'edit') {
          const edited = STATE.attention.find(o => o.orderId === orderId);
          if (edited) edited.attentionNote = note;
          closeFlagModal();
          renderAttention();
          showToast('Note updated');
        } else {
          const idx = STATE.active.findIndex(o => o.orderId === orderId);
          const flagged = idx === -1 ? null : STATE.active.splice(idx, 1)[0];
          if (flagged) {
            flagged.status = 'Needs Attention';
            flagged.attentionNote = note;
            flagged.attentionDate = new Date().toISOString();
            flagged.attentionBy = initials;
            STATE.attention.unshift(flagged);
          }
          closeFlagModal();
          renderActive(); renderSummary(); renderAttention();
          showToast('Flagged: ' + (flagged ? flagged.itemName : 'item'), {
            actionLabel: 'Undo', ttl: 5000,
            onAction: async () => {
              try {
                const undo = await call('restoreOrder', { orderId: orderId });
                if (!undo || !undo.ok) throw new Error('Failed');
                await refresh();
                showToast('Undone');
              } catch (err) {
                console.error(err);
                showToast('Undo failed', { error: true });
              }
            }
          });
        }
      } catch (e) {
        console.error(e);
        showToast(mode === 'edit' ? 'Could not update note' : 'Could not flag item',
          { error: true });
        syncFlagSave();
      }
    }

    async function handleOrdered(orderId) {
      const initials = getInitials();
      if (!initials) {
        // No initials set yet on this device — prompt at the form
        switchTab('list');
        document.getElementById('initials').focus();
        showToast('Please enter your initials in the form first', { error: true });
        return;
      }

      // Optimistically remove from whichever list supplied the action.
      let source = STATE.active;
      let idx = source.findIndex(o => o.orderId === orderId);
      const fromAttention = idx === -1;
      if (fromAttention) {
        source = STATE.attention;
        idx = source.findIndex(o => o.orderId === orderId);
      }
      if (idx === -1) return;
      const removed = source.splice(idx, 1)[0];
      renderActive(); renderSummary(); renderAttention();

      // Send to server
      try {
        const res = await call('markOrdered', { orderId: orderId, initials: initials });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
      } catch (e) {
        console.error(e);
        source.splice(idx, 0, removed);
        renderActive(); renderSummary(); renderAttention();
        showToast('Could not mark ordered', { error: true });
        return;
      }

      // Show undo for 5s
      showToast('Ordered: ' + removed.itemName, {
        actionLabel: 'Undo',
        ttl: 5000,
        onAction: async () => {
          try {
            const res = await call('undoOrdered', { orderId: orderId });
            if (!res || !res.ok) throw new Error('Failed');
            await refresh();
            showToast('Undone');
          } catch (err) {
            console.error(err);
            showToast('Undo failed', { error: true });
          }
        }
      });
      // Refresh recent-ordered count after the toast appears
      setTimeout(refresh, 200);
    }

    async function handleRestore(orderId) {
      const idx = STATE.attention.findIndex(o => o.orderId === orderId);
      if (idx === -1) return;
      try {
        const res = await call('restoreOrder', { orderId: orderId });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
        const restored = STATE.attention.splice(idx, 1)[0];
        restored.status = 'Active';
        restored.attentionDate = '';
        restored.attentionBy = '';
        STATE.active.unshift(restored);
        renderActive(); renderSummary(); renderAttention();
        showToast('Sent back to the Order List');
      } catch (e) {
        console.error(e);
        showToast('Could not send item back', { error: true });
      }
    }

    async function handleRemove(orderId) {
      const initials = getInitials();
      if (!initials) {
        switchTab('list');
        document.getElementById('initials').focus();
        showToast('Please enter your initials in the form first', { error: true });
        return;
      }
      const idx = STATE.attention.findIndex(o => o.orderId === orderId);
      if (idx === -1) return;
      const removed = STATE.attention[idx];
      try {
        const res = await call('removeOrder', {
          orderId: orderId, initials: initials
        });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
        STATE.attention.splice(idx, 1);
        renderAttention();
        showToast('Removed: ' + removed.itemName, {
          actionLabel: 'Undo', ttl: 5000,
          onAction: async () => {
            try {
              const undo = await call('undoRemove', { orderId: orderId });
              if (!undo || !undo.ok) throw new Error('Failed');
              await refresh();
              showToast('Undone');
            } catch (err) {
              console.error(err);
              showToast('Undo failed', { error: true });
            }
          }
        });
      } catch (e) {
        console.error(e);
        showToast('Could not remove item', { error: true });
      }
    }

    async function handleReadd(orderId) {
      const initials = getInitials();
      if (!initials) {
        switchTab('list');
        document.getElementById('initials').focus();
        showToast('Please enter your initials in the form first', { error: true });
        return;
      }
      try {
        const res = await call('reAddOrder', { orderId: orderId, addedBy: initials });
        if (!res || !res.ok) throw new Error(res && res.error || 'Failed');
        showToast('Re-added to the list');
        await refresh();
      } catch (e) {
        console.error(e);
        showToast('Could not re-add', { error: true });
      }
    }

    /* ---- Wire up ---- */
    function init() {
      // Tabs
      document.getElementById('tab-list')
        .addEventListener('click', () => switchTab('list'));
      document.getElementById('tab-summary')
        .addEventListener('click', () => switchTab('summary'));
      document.getElementById('tab-attention')
        .addEventListener('click', () => switchTab('attention'));

      // Form
      document.getElementById('dateAdded').value = todayLocalISO();
      document.getElementById('addForm').addEventListener('submit', handleAdd);

      // Refresh buttons
      document.getElementById('refreshList')
        .addEventListener('click', refresh);
      document.getElementById('refreshSummary')
        .addEventListener('click', refresh);
      document.getElementById('refreshAttention')
        .addEventListener('click', refresh);

      // Attention-note modal
      document.getElementById('flagNote')
        .addEventListener('input', syncFlagSave);
      document.getElementById('flagSave')
        .addEventListener('click', saveFlagNote);
      document.getElementById('flagCancel')
        .addEventListener('click', closeFlagModal);

      // Delegated clicks
      document.addEventListener('click', e => {
        const chip = e.target.closest('[data-chip]');
        if (chip) {
          document.getElementById('flagNote').value =
            chip.getAttribute('data-chip');
          syncFlagSave();
          return;
        }
        const flag = e.target.closest('[data-flag]');
        if (flag) {
          openFlagModal(flag.getAttribute('data-flag'), 'flag');
          return;
        }
        const edit = e.target.closest('[data-editnote]');
        if (edit) {
          openFlagModal(edit.getAttribute('data-editnote'), 'edit');
          return;
        }
        const restore = e.target.closest('[data-restore]');
        if (restore) {
          handleRestore(restore.getAttribute('data-restore'));
          return;
        }
        const remove = e.target.closest('[data-remove]');
        if (remove) {
          handleRemove(remove.getAttribute('data-remove'));
          return;
        }
        const ord = e.target.closest('[data-ordered]');
        if (ord) { handleOrdered(ord.getAttribute('data-ordered')); return; }
        const re = e.target.closest('[data-readd]');
        if (re) { handleReadd(re.getAttribute('data-readd')); return; }
      });

      // Initials field — prefill from localStorage, remember on every change
      const initialsEl = document.getElementById('initials');
      initialsEl.value = getInitials();
      initialsEl.addEventListener('input', () => {
        // Force uppercase + alphanumeric while typing
        const cleaned = saveInitials(initialsEl.value);
        if (cleaned !== initialsEl.value) initialsEl.value = cleaned;
      });

      // Initial fetch
      refresh();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
